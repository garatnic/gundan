background:light-dark(#e8f1fccc,#1c3047cc)}#math-army .panel{padding:12px 8px}#math-army .message{min-height:22px;text-align:center;margin:0 0 7px;font-weight:600}#math-army [hidden]{display:none!important}#math-army .question-slot{display:grid}#math-army .question-slot>*{grid-area:1/1}#math-army .resume{width:100%;height:100%}#math-army .question{display:flex;flex-direction:row;align-items:center;flex-wrap:nowrap;gap:8px}#math-army .choices{flex:1 1 0;min-width:0;width:auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}#math-army .choices button{min-width:0;min-height:44px;padding:10px 2px;font-size:clamp(18px,4.8vw,22px);white-space:nowrap}#math-army .choices .wrong{background:light-dark(#f9dce1,#643b49)}#math-army .expression{flex:0 0 auto;white-space:nowrap;font-size:clamp(18px,4.8vw,24px);letter-spacing:-.5px;font-weight:700}#math-army button{border:0;border-radius:10px;padding:12px;background:light-dark(#dde6f5,#30415c);color:inherit;font:600 14px system-ui;min-height:44px;touch-action:manipulation}#math-army .answer{background:light-dark(#346fda,#80aaff);color:light-dark(#fff,#102347)}#math-army button:disabled{opacity:.45}#math-army .upgrades{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}#math-army .upgrade{text-align:left;display:flex;flex-direction:column;gap:4px;background:light-dark(#fff,#25364d);border:1px solid light-dark(#d5dfec,#3a4d67)}#math-army .upgrade small{font-size:12px;font-weight:400}#math-army .bottom{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-top:12px;font-size:12px}#math-army .note{font-size:12px;text-align:center;margin:10px 0 0;color:light-dark(#53637b,#b9c7db)}@keyframes ma-float{to{translate:0 -35px;opacity:0}}@keyframes ma-ring{to{scale:1.2;opacity:0}}

<div class="shell"><div class="top"><strong>⚔ さんすう ぐんだん</strong><span class="wallet">🪙 0</span></div>
<div class="arenaViewport" tabindex="0" role="region" aria-label="せんじょう。たてに スクロールできるよ"><div class="arena battlefield" role="img" aria-label="正解すると味方が出撃し、3秒間だけ戦闘が進みます"><div class="enemyinfo"><strong class="stage"></strong><div class="track"><div class="bar"></div></div><span class="enemyStats"></span></div><div class="enemy">🤖</div><div class="state"></div></div></div>
<div class="panel"><div class="message" aria-live="polite">せいかいで 3びょう バトル！</div><div class="question-slot"><button type="button" class="resume answer cursor-interaction" hidden>戦闘再開</button><div class="question"><div class="expression" id="army-expression"></div><div class="choices" role="group" aria-labelledby="army-expression"></div></div></div>
<div class="upgrades"></div><div class="bottom"><span class="progressText"></span><button type="button" class="prestige cursor-interaction" disabled>てんせい：10クリアで かいほう</button></div><p class="note">せいかいの たびに 3びょう バトル。つよくすると、いまいる なかまも パワーアップ！</p></div></div>

<script>
(()=>{
qRefresh();
function qRefresh(){document.querySelector('#math-army .refresh-build').onclick=()=>{const url=new URL(location.href);url.searchParams.set('v',document.querySelector('meta[name="gundan-version"]').content);url.searchParams.set('_refresh',String(Date.now()));location.replace(url.href)}}
const root=document.getElementById('math-army'),q=s=>root.querySelector(s),arena=q('.arena'),choices=q('.choices'),message=q('.message');
let coins=0,stage=1,prestige=0,cleared=0,correct=0,levels=[0,0,0,0],costs=[8,5,6,5],units=[],effects=[],pendingAreas=[],enemies=[],remaining=0,last=0,answer=0,uid=0,eid=0,strategyPaused=false;
const bossAreaAttack={radius:20,count:1,delay:1};
const names=['👥 にんずう','⚔ こうげき','⚡ はやさ','♥ HP'],growth=[1.7,1.6,1.5,1.5];
const count=()=>3+levels[0],attack=()=>1+levels[1],period=()=>Math.max(.75,5*Math.pow(.9,levels[2])),health=()=>1+levels[3],mult=()=>1+prestige*.5;
// Only subtraction round-off is snapped to zero; positive fractional HP is retained.
const alive=actor=>actor.hp>0;
function hpPercent(actor){return actor.max>0?Math.max(0,Math.min(100,actor.hp/actor.max*100)):0}
function hpText(value){return value>0&&value<.01?'<0.01':String(Number(Math.max(0,value).toFixed(2)))}
function damage(actor,amount){
 if(!alive(actor)||!Number.isFinite(amount)||amount<=0)return;
 const before=actor.hp,next=before-amount;
 const tolerance=Number.EPSILON*Math.max(Math.abs(before),Math.abs(amount))*8;
 actor.hp=next<=tolerance?0:next;
}
function hit(actor,amount,x=actor.x,y=actor.y-10){if(!alive(actor))return;damage(actor,amount);float('−'+hpText(amount),x,y)}
function selectTarget(unit){const target=enemies.find(e=>e.id===unit.targetId&&alive(e))||currentEnemy();unit.targetId=target?.id??null;return target}
// Geometry is in world pixels. Formation reservations never decide attack eligibility.
const unitTypes={basic:{radius:11,attackRange:0,speed:175}};
const formationRules={spacing:20,minimum:11,contactTolerance:.75,arrival:.25};
let formationDirty=true,formationCache=new Map();
function surfaceDistance(unit,enemy){return Math.hypot(unit.x-enemy.x,unit.y-enemy.y)-unit.radius-enemy.radius}
function canAttack(unit,enemy){return alive(unit)&&alive(enemy)&&surfaceDistance(unit,enemy)<=unit.attackRange+formationRules.contactTolerance}
function touching(unit,enemy){return alive(unit)&&alive(enemy)&&surfaceDistance(unit,enemy)<=formationRules.contactTolerance}
function attackPosition(unit,enemy){return formationCache.get(enemy.id)?.byKey.get(unit.placementKey)||null}
function inPosition(unit,position){return !!position&&Math.hypot(position.x-unit.x,position.y-unit.y)<=formationRules.arrival}
function makeFormation(enemy,spacing){
 const slots=[],byKey=new Map(),radius=enemy.radius+unitTypes.basic.radius,w=arena.clientWidth,h=arena.clientHeight;
 const add=(key,x,y,front)=>{if(x<11||x>w-11||y<11||y>h-11)return;const slot={key,x,y,front};slots.push(slot);byKey.set(key,slot)};
 // Contact arc follows the collider; its capacity comes from circumference and spacing.
 const divisions=Math.max(1,Math.ceil(Math.PI/(2*Math.asin(Math.min(1,spacing/(2*radius))))));
 for(let i=0;i<=divisions;i++){const angle=Math.PI*i/divisions;add('contact:'+i,enemy.x+Math.cos(angle)*radius,enemy.y+Math.sin(angle)*radius,true)}
 slots.sort((a,b)=>Math.abs(a.x-enemy.x)-Math.abs(b.x-enemy.x)||a.x-b.x);
 // Staggered triangular lattice: six nearest neighbours, sqrt(3)/2 row pitch.
 const pitch=spacing*Math.sqrt(3)/2;
 for(let row=0,y=enemy.y+radius+spacing;y<=h-11;row++,y+=pitch){
  const offset=row%2?0:spacing/2;
  for(let col=Math.ceil((11-enemy.x-offset)/spacing);;col++){
   const x=enemy.x+offset+col*spacing;if(x>w-11)break;add('rear:'+row+':'+col,x,y,false);
  }
 }
 return {slots,byKey,spacing};
}
function updateFormation(){
 const liveEnemies=enemies.filter(alive),liveUnits=units.filter(alive);
 for(const unit of liveUnits){const old=unit.targetId;selectTarget(unit);if(old!==unit.targetId){unit.placementKey=null;formationDirty=true}}
 const signature=liveEnemies.map(e=>[e.id,e.x,e.y,e.radius]).flat().join(',')+':'+arena.clientWidth+':'+arena.clientHeight;
 if(updateFormation.signature!==signature){formationDirty=true;updateFormation.signature=signature}
 if(!formationDirty)return;
 const next=new Map();
 for(const enemy of liveEnemies){
  const assigned=liveUnits.filter(u=>u.targetId===enemy.id);
  let layout=makeFormation(enemy,formationRules.spacing);
  // Compress only when the ordinary lattice has no room, never just to add firepower.
  if(assigned.length>layout.slots.length)layout=makeFormation(enemy,formationRules.minimum);
  const occupied=new Map(),available=new Set(assigned);
  const previous=formationCache.get(enemy.id);
  if(previous?.spacing!==layout.spacing)for(const unit of assigned)unit.placementKey=null;
  if(previous?.spacing===layout.spacing)for(const unit of assigned){
   if(layout.byKey.has(unit.placementKey)&&!occupied.has(unit.placementKey)){
    occupied.set(unit.placementKey,unit);available.delete(unit);
   }else unit.placementKey=null;
  }
  const reserve=(unit,slot)=>{if(unit.placementKey)occupied.delete(unit.placementKey);unit.placementKey=slot.key;unit.approaching=slot.front&&Math.abs(slot.x-enemy.x)>(enemy.radius+unit.radius)*.75;occupied.set(slot.key,unit);available.delete(unit)};
  // Vacant contact locations choose the closest rear/unassigned soldier, with stable ID ties.
  for(const slot of layout.slots.filter(s=>s.front)){
   if(occupied.has(slot.key))continue;
   let best=null,distance=Infinity;
   for(const unit of assigned){if(layout.byKey.get(unit.placementKey)?.front)continue;const d=Math.hypot(unit.x-slot.x,unit.y-slot.y);if(d<distance-1e-8||(Math.abs(d-distance)<1e-8&&unit.id<best.id)){best=unit;distance=d}}
   if(best)reserve(best,slot);
  }
  // Fill the nearest row first with nearby soldiers, not spawn/array order.
  // This keeps soldiers born in higher spawn rows from blocking older soldiers behind them.
  const free=layout.slots.filter(slot=>!occupied.has(slot.key)).sort((a,b)=>a.y-b.y||Math.abs(a.x-enemy.x)-Math.abs(b.x-enemy.x));
  for(const slot of free){
   if(!available.size)break;
   let best=null,distance=Infinity;
   for(const unit of available){const d=Math.hypot(unit.x-slot.x,unit.y-slot.y);if(d<distance){best=unit;distance=d}}
   if(best)reserve(best,slot);
  }
  for(const unit of available)unit.placementKey=null;
  next.set(enemy.id,layout);
 }
 formationCache=next;formationDirty=false;
}
// Small spatial bins keep separation queries local, rather than comparing every pair.
function spatialIndex(actors){
 const size=22,bins=new Map(),key=(x,y)=>Math.floor(x/size)+','+Math.floor(y/size);
 const add=actor=>{const k=key(actor.x,actor.y);if(!bins.has(k))bins.set(k,new Set());bins.get(k).add(actor)};
 const remove=actor=>bins.get(key(actor.x,actor.y))?.delete(actor);
 const nearby=(x,y,r)=>{const found=[];for(let iy=Math.floor((y-r)/size);iy<=Math.floor((y+r)/size);iy++)for(let ix=Math.floor((x-r)/size);ix<=Math.floor((x+r)/size);ix++)for(const actor of bins.get(ix+','+iy)||[])found.push(actor);return found};
 for(const actor of actors)if(alive(actor))add(actor);return {add,remove,nearby};
}
function moveUnit(unit,position,dt,index){
 if(!position)return;
 const enemy=enemies.find(e=>e.id===unit.targetId);
 if(unit.approaching&&enemy){
  const rx=position.x-enemy.x,ry=position.y-enemy.y,r=Math.hypot(rx,ry),approach={x:position.x+rx/r*20,y:position.y+ry/r*20};
  if(canAttack(unit,enemy)||Math.hypot(approach.x-unit.x,approach.y-unit.y)<=1)unit.approaching=false;else position=approach;
 }
 const dx=position.x-unit.x,dy=position.y-unit.y,d=Math.hypot(dx,dy);if(d<=formationRules.arrival)return;
 const travel=Math.min(d,dt*unitTypes[unit.type].speed),angle=Math.atan2(dy,dx),near=index.nearby(unit.x,unit.y,travel+22);
 let best=null,bestScore=0;
 for(const turn of [0,.5,-.5,1,-1,1.5,-1.5]){
  const vx=Math.cos(angle+turn)*travel,vy=Math.sin(angle+turn)*travel;
  let scale=1;
  if(vx>0)scale=Math.min(scale,(arena.clientWidth-unit.radius-unit.x)/vx);else if(vx<0)scale=Math.min(scale,(unit.radius-unit.x)/vx);
  if(vy>0)scale=Math.min(scale,(arena.clientHeight-unit.radius-unit.y)/vy);else if(vy<0)scale=Math.min(scale,(unit.radius-unit.y)/vy);
  // Exact swept-circle intersection prevents tunnelling without iterative pair relaxation.
  const limit=(other,radius)=>{
   const ox=unit.x-other.x,oy=unit.y-other.y,a=vx*vx+vy*vy,b=ox*vx+oy*vy,c=ox*ox+oy*oy-radius*radius;
   if(b>=0)return; // moving away, including recovery if an enemy later moves into a soldier
   if(c<0){scale=0;return}
   const disc=b*b-a*c;if(disc>0)scale=Math.min(scale,Math.max(0,(-b-Math.sqrt(disc))/a-1e-7));
  };
  for(const other of near)if(other!==unit)limit(other,formationRules.minimum);
  for(const enemy of enemies)if(alive(enemy))limit(enemy,unit.radius+enemy.radius);
  scale=Math.max(0,scale);
  const progress=d-Math.hypot(dx-vx*scale,dy-vy*scale),score=progress-(turn&&Math.sign(turn)!==unit.steerSide ? .03 : 0);
  if(score>bestScore+1e-6){bestScore=score;best={x:unit.x+vx*scale,y:unit.y+vy*scale,turn}}
  if(turn===0&&scale===1)break;
 }
 if(best){index.remove(unit);unit.x=best.x;unit.y=best.y;if(best.turn)unit.steerSide=Math.sign(best.turn);index.add(unit)}
}
function spawnPosition(index){
 const w=arena.clientWidth,h=arena.clientHeight;
 for(const spacing of [formationRules.spacing,formationRules.minimum]){
  const pitch=spacing*Math.sqrt(3)/2;
  for(let row=0,y=h-22;y>=11;row++,y-=pitch){
   const offset=row%2?spacing/2:0;
   // Middle first, then alternate left/right. All occupied spawn points are excluded.
   for(let k=0;k<Math.ceil(w/spacing)+1;k++){
    const col=k===0?0:(k%2?1:-1)*Math.ceil(k/2),x=w/2+col*spacing+offset;
    if(x<11||x>w-11)continue;
    if(index.nearby(x,y,spacing).some(u=>Math.hypot(x-u.x,y-u.y)<spacing-1e-6))continue;
    if(enemies.some(e=>alive(e)&&Math.hypot(x-e.x,y-e.y)<e.radius+11))continue;
    return {x,y};
   }
  }
 }
 // A finite battlefield cannot fit unlimited bodies. Keep immediate spawning; no new cap/queue.
 return {x:w/2,y:h-22};
}
function removeDeadUnits(){for(let i=units.length-1;i>=0;i--){const unit=units[i];if(!alive(unit)){earn(1,unit.x,unit.y);unit.el.remove();units.splice(i,1);formationDirty=true}}}
function currentEnemy(){return enemies.find(alive)||null}
function combatMode(){return strategyPaused?'strategyPaused':remaining>0?'running':'autoPaused'}
function pauseStrategy(){strategyPaused=true;q('.question-slot').style.minHeight=q('.question').getBoundingClientRect().height+'px';q('.question').style.visibility='hidden';q('.question').inert=true;q('.question').setAttribute('aria-hidden','true');q('.resume').hidden=false}
function restoreQuestion(){q('.question').style.visibility='';q('.question').inert=false;q('.question').removeAttribute('aria-hidden');q('.resume').hidden=true}
q('.resume').onclick=()=>{strategyPaused=false;restoreQuestion();message.textContent=remaining>0?'バトル さいかい！':'つぎの せいかいで また うごくよ！';update()};
function resetCombatState(){remaining=0;strategyPaused=false;restoreQuestion()}
function clearAllUnits(){for(const unit of units)unit.el.remove();units=[];formationDirty=true;formationCache.clear()}
function transitionStage(){for(const effect of effects)effect.el.remove();effects=[];stage++;makeEnemy();for(const unit of units){unit.targetId=currentEnemy()?.id??null;unit.state='moving';unit.placementKey=null}formationDirty=true}
function makeEnemy(){clearBossAreas();const boss=stage%5===0,type=boss?1:(stage-1)%3;const max=Math.ceil(20*Math.pow(1.25,stage-1)*(boss?1.7:1));const enemy={id:eid++,stage,x:arena.clientWidth/2,y:116,radius:26.5,max,hp:max,atk:1+Math.floor((stage-1)/5),period:type===0?10:type===1?15:5,cd:0,type,boss,reward:Math.ceil(5*Math.pow(1.2,stage-1))*(boss?3:1)};enemies=[enemy];q('.enemy').textContent=boss?'👑':type===0?'🤖':type===1?'🗿':'🥷';q('.enemy').style.opacity='1';q('.enemy').style.left=enemy.x+'px';q('.enemy').style.top=enemy.y+'px';formationDirty=true}
function problem(){let a,b,op;const type=Math.floor(Math.random()*4);if(type===0){a=1+Math.floor(Math.random()*20);b=1+Math.floor(Math.random()*20);op='＋';answer=a+b}else if(type===1){a=1+Math.floor(Math.random()*20);b=Math.floor(Math.random()*(a+1));op='−';answer=a-b}else if(type===2){a=1+Math.floor(Math.random()*9);b=1+Math.floor(Math.random()*9);op='×';answer=a*b}else{b=1+Math.floor(Math.random()*9);answer=1+Math.floor(Math.random()*9);a=b*answer;op='÷'}q('.expression').textContent=`${a}${op}${b}＝`;renderChoices()}

function renderChoices(){
 const options=new Set([answer]);
 while(options.size<4){const offset=Math.floor(Math.random()*19)-9;const value=answer+offset;if(value>=0)options.add(value)}
 const values=[...options];
 for(let i=values.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[values[i],values[j]]=[values[j],values[i]]}
 choices.replaceChildren();
 for(const value of values){const b=document.createElement('button');b.type='button';b.className='answer cursor-interaction';b.textContent=String(value);b.onclick=()=>choose(value,b);choices.appendChild(b)}
}


function float(text,x,y){const el=document.createElement('span');el.className='float';el.textContent=text;el.style.left=x+'px';el.style.top=y+'px';arena.appendChild(el);effects.push({el,t:.8})}
function earn(n,x,y){const reward=n*mult();coins+=reward;if(n)float('🪙 +'+Number(reward.toFixed(1)),x,y)}
function update(){const enemy=currentEnemy();q('.wallet').textContent='🪙 '+Number(coins.toFixed(1));q('.stage').textContent=`ステージ ${stage}　${enemy.boss?'ボス': ['たんたい','はんい','すばやい'][enemy.type]}`;q('.bar').style.width=hpPercent(enemy)+'%';q('.enemyStats').textContent=`HP ${hpText(enemy.hp)}/${hpText(enemy.max)} ｜ こうげき ${enemy.atk}・${enemy.period}びょう ｜ ${enemy.type===1?'まわりに こうげき':'1たいに こうげき'}`;q('.state').textContent=combatMode()==='running'?`バトル！ あと ${remaining.toFixed(1)}びょう　／ なかま ${units.length}たい`:`${strategyPaused?'さくせん ストップ':'ストップ'}　／ なかま ${units.length}たい`;q('.progressText').textContent=`せいかい ${correct}もん ｜ コイン ×${mult().toFixed(1)}`;const buttons=root.querySelectorAll('.upgrade');buttons.forEach((b,i)=>{const values=[`${count()} → ${count()+1}たい`,`${attack()} → ${attack()+1}`,`${period().toFixed(2)} → ${Math.max(.75,period()*.9).toFixed(2)}びょう`,`${health()} → ${health()+1}`];b.innerHTML=`<span>${names[i]}　Lv.${levels[i]}</span><small>${values[i]}</small><span>🪙 ${costs[i]}</span>`;b.disabled=coins<costs[i]||(i===2&&period()<=.75)});q('.prestige').disabled=combatMode()==='running'||cleared<10;q('.prestige').textContent=cleared>=10?`てんせい → コイン ×${(mult()+.5).toFixed(1)}`:'てんせい：10クリアで かいほう'}
for(let i=0;i<4;i++){const b=document.createElement('button');b.type='button';b.className='upgrade cursor-interaction';b.onclick=()=>{if(coins<costs[i]||(i===2&&period()<=.75))return;pauseStrategy();coins-=costs[i];levels[i]++;costs[i]=Math.ceil(costs[i]*growth[i]);if(i===3)units.forEach(u=>{u.hp+=1;u.max+=1});message.textContent=names[i]+' が レベルアップ！';update()};q('.upgrades').appendChild(b)}
function choose(value,button){if(strategyPaused||button.disabled||!choices.children.length||!Array.from(choices.children).includes(button))return;if(value!==answer){message.textContent='もういちど かんがえてみよう！';button.classList.add('wrong');button.disabled=true;return}correct++;const spawnIndex=spatialIndex(units);for(let i=0;i<count();i++){const el=document.createElement('div');el.className='soldier';el.innerHTML='🛡️<div class="life"><i></i></div>';arena.appendChild(el);const position=spawnPosition(spawnIndex);const unit={id:uid++,type:'basic',targetId:currentEnemy()?.id??null,state:'moving',radius:unitTypes.basic.radius,attackRange:unitTypes.basic.attackRange,placementKey:null,steerSide:1,el,x:position.x,y:position.y,hp:health(),max:health(),cd:0};units.push(unit);spawnIndex.add(unit)}formationDirty=true;remaining=3;problem();message.textContent='せいかい！ とつげき！';update()};
q('.prestige').onclick=()=>{if(cleared<10||combatMode()==='running')return;prestige++;stage=1;cleared=0;coins=0;levels=[0,0,0,0];costs=[8,5,6,5];clearAllUnits();resetCombatState();makeEnemy();problem();message.textContent='てんせい！ コインが ふえやすくなった！';update()};
function win(){if(!enemies.length||enemies.some(alive)||enemies.every(e=>e.rewarded))return;const enemy=enemies[0];for(const e of enemies)e.rewarded=true;cleared=Math.max(cleared,stage);const reward=enemy.reward;earn(reward,arena.clientWidth/2-45,114);message.textContent=`🎉 ステージ ${stage} クリア！ ほうしゅう ${reward}コイン`;transitionStage();update()}


function clearBossAreas(){for(const group of pendingAreas)for(const area of group.areas)area.el.remove();pendingAreas=[]}
function bossAttack(enemy){if(!enemy)return [];
 const {radius,count,delay}=bossAreaAttack;
 const targets=units.filter(u=>u.hp>0);if(!targets.length)return [];
 const group={enemyId:enemy.id,remaining:delay,damage:enemy.atk,areas:[]};
 for(let i=0;i<count;i++){
  const target=targets[Math.floor(Math.random()*targets.length)];
  const angle=Math.random()*Math.PI*2,distance=Math.sqrt(Math.random())*radius*.8;
  const x=target.x+Math.cos(angle)*distance,y=target.y+Math.sin(angle)*distance;
  const circle=document.createElement('div');circle.className='boss-area';
  Object.assign(circle.style,{left:x-radius+'px',top:y-radius+'px',width:radius*2+'px',height:radius*2+'px'});
  arena.appendChild(circle);group.areas.push({x,y,radius,el:circle});
 }
 pendingAreas.push(group);return [];
}
function advanceBossAreas(dt){
 for(let i=pendingAreas.length-1;i>=0;i--){
  const group=pendingAreas[i];if(!enemies.some(e=>e.id===group.enemyId&&alive(e))){for(const area of group.areas)area.el.remove();pendingAreas.splice(i,1);continue;}group.remaining-=dt;if(group.remaining>1e-10)continue;
  const victims=new Set();
  for(const area of group.areas){
   for(const unit of units)if(Math.hypot(unit.x-area.x,unit.y-area.y)<=area.radius)victims.add(unit);
   area.el.remove();
  }
  for(const unit of victims){hit(unit,group.damage)}
  pendingAreas.splice(i,1);
 }
}
function attackEnemy(enemy,engaged,dt){
 if(!alive(enemy)||!engaged.length)return;
 enemy.cd-=dt;if(enemy.cd>0)return;enemy.cd+=enemy.period;
 const target=engaged.reduce((a,b)=>a.hp<b.hp?a:b);
 if(enemy.boss){bossAttack(enemy);return}
 let victims=[target];
 if(enemy.type===1){
  victims=engaged.filter(u=>Math.hypot(u.x-target.x,u.y-target.y)<=55);
  const ring=document.createElement('div');ring.className='ring';Object.assign(ring.style,{left:target.x-55+'px',top:target.y-55+'px',width:'110px',height:'110px'});arena.appendChild(ring);effects.push({el:ring,t:.4});
 }
 for(const unit of victims)hit(unit,enemy.atk);
}
function step(dt){
 if(dt<=0||strategyPaused)return;
 removeDeadUnits();updateFormation();const index=spatialIndex(units);
 for(const unit of units){
  if(!alive(unit))continue;
  const enemy=selectTarget(unit);if(!enemy)continue;
  const position=attackPosition(unit,enemy);
  moveUnit(unit,position,dt,index);
  // Timers advance only while in range, clamp at zero: no banked burst on re-entry.
  if(!canAttack(unit,enemy)){unit.state=inPosition(unit,position)?'waiting':'moving';continue}
  unit.state='attacking';unit.cd=Math.max(0,unit.cd-dt);
  if(unit.cd<=0){unit.cd=period();hit(enemy,attack(),enemy.x-15+Math.random()*30,enemy.y-24)}
 }
 // Resolve old warnings before creating new ones: each new warning lasts a full second.
 advanceBossAreas(dt);removeDeadUnits();
 for(const enemy of enemies){
  const engaged=units.filter(u=>alive(u)&&u.targetId===enemy.id&&touching(u,enemy));
  attackEnemy(enemy,engaged,dt);
 }
 removeDeadUnits();win();
}
document.addEventListener('visibilitychange',()=>{last=0});
function frame(t){const dt=document.hidden?0:Math.min(last?(t-last)/1000:0,.04);last=t;if(combatMode()==='running'){const slice=Math.min(dt,remaining);remaining-=slice;step(slice);if(remaining<=0){remaining=0;message.textContent='つぎの せいかいで また うごくよ！';}update()}for(const u of units){u.el.style.transform=`translate(${u.x-11}px,${u.y-11}px)`;u.el.querySelector('i').style.width=hpPercent(u)+'%'}for(let i=effects.length-1;i>=0;i--){effects[i].t-=dt;if(effects[i].t<=0){effects[i].el.remove();effects.splice(i,1)}}requestAnimationFrame(frame)}makeEnemy();problem();update();requestAnimationFrame(frame);
})();
</script>
