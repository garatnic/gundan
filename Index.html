<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>さんすう ぐんだん</title>
<style>body{margin:0;padding:12px;background:light-dark(#e7edf6,#0e1725);color-scheme:light dark}.cursor-interaction{cursor:pointer}button:disabled{cursor:default}</style>
</head>
<body>
<div id="math-army">
<style>
#math-army{color-scheme:light dark;font:14px system-ui,sans-serif;color:light-dark(#25344d,#e4edff);max-width:560px;margin:auto}#math-army *{box-sizing:border-box}#math-army .shell{background:light-dark(#f5f7fc,#152032);border-radius:20px;overflow:hidden}#math-army .top{padding:16px 18px 10px;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;padding-right:90px}#math-army .arena{position:relative;height:265px;background:light-dark(#e8f1fc,#1c3047);overflow:hidden}#math-army .enemyinfo{position:absolute;top:12px;left:16px;right:16px;text-align:center;z-index:2}#math-army .track{height:9px;border-radius:8px;background:light-dark(#cbd8e9,#425064);overflow:hidden;margin:6px auto;max-width:300px}#math-army .bar{height:100%;background:light-dark(#d05b77,#f38ba2);width:100%}#math-army .enemy{position:absolute;top:116px;left:50%;transform:translate(-50%,-50%);font-size:53px}#math-army .soldier{position:absolute;width:22px;text-align:center;font-size:20px;line-height:22px;will-change:transform}#math-army .life{height:3px;background:light-dark(#bfd1df,#3c5067);border-radius:3px;overflow:hidden}#math-army .life i{display:block;height:100%;background:light-dark(#26a27c,#58d4ac)}#math-army .float{position:absolute;pointer-events:none;font-weight:700;animation:ma-float .8s forwards;z-index:4}#math-army .ring{position:absolute;border:3px solid light-dark(#de7955,#ffad86);border-radius:50%;pointer-events:none;opacity:.65;animation:ma-ring .4s forwards}#math-army .state{position:absolute;bottom:8px;width:100%;text-align:center;font-size:12px}#math-army .panel{padding:12px 16px}#math-army .message{min-height:22px;text-align:center;margin:0 0 7px;font-weight:600}#math-army .question{display:flex;flex-direction:column;gap:10px}#math-army .choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}#math-army .choices button{font-size:22px}#math-army .choices .wrong{background:light-dark(#f9dce1,#643b49)}#math-army .expression{font-size:25px;font-weight:700}#math-army button{border:0;border-radius:10px;padding:12px;background:light-dark(#dde6f5,#30415c);color:inherit;font:600 14px system-ui;min-height:44px;touch-action:manipulation}#math-army .answer{background:light-dark(#346fda,#80aaff);color:light-dark(#fff,#102347)}#math-army button:disabled{opacity:.45}#math-army .upgrades{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}#math-army .upgrade{text-align:left;display:flex;flex-direction:column;gap:4px;background:light-dark(#fff,#25364d);border:1px solid light-dark(#d5dfec,#3a4d67)}#math-army .upgrade small{font-size:12px;font-weight:400}#math-army .bottom{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-top:12px;font-size:12px}#math-army .note{font-size:12px;text-align:center;margin:10px 0 0;color:light-dark(#53637b,#b9c7db)}@keyframes ma-float{to{translate:0 -35px;opacity:0}}@keyframes ma-ring{to{scale:1.2;opacity:0}}
</style>
<div class="shell"><div class="top"><strong>⚔ さんすう ぐんだん</strong><span class="wallet">🪙 0</span></div>
<div class="arena" role="img" aria-label="正解すると味方が出撃し、3秒間だけ戦闘が進みます"><div class="enemyinfo"><strong class="stage"></strong><div class="track"><div class="bar"></div></div><span class="enemyStats"></span></div><div class="enemy">🤖</div><div class="state"></div></div>
<div class="panel"><div class="message" aria-live="polite">せいかいで 3びょう バトル！</div><div class="question"><div class="expression" id="army-expression"></div><div class="choices" role="group" aria-labelledby="army-expression"></div></div>
<div class="upgrades"></div><div class="bottom"><span class="progressText"></span><button type="button" class="prestige cursor-interaction" disabled>てんせい：10クリアで かいほう</button></div><p class="note">かんがえる あいだは ストップ。つよくすると、いまいる なかまも パワーアップ！</p></div></div>
<script>
(()=>{
const root=document.getElementById('math-army'),q=s=>root.querySelector(s),arena=q('.arena'),choices=q('.choices'),message=q('.message');
let coins=0,stage=1,prestige=0,cleared=0,correct=0,levels=[0,0,0,0],costs=[8,5,6,5],units=[],effects=[],enemy,remaining=0,last=0,answer=0,uid=0;
const names=['👥 にんずう','⚔ こうげき','⚡ はやさ','♥ HP'],growth=[1.7,1.6,1.5,1.5];
const count=()=>3+levels[0],attack=()=>1+levels[1],period=()=>Math.max(.15,Math.pow(.9,levels[2])),health=()=>3+levels[3]*2,mult=()=>1+prestige*.5;
function makeEnemy(){const boss=stage%5===0,type=boss?1:(stage-1)%3;const max=Math.ceil(20*Math.pow(1.25,stage-1)*(boss?1.7:1));enemy={max,hp:max,atk:1+Math.floor((stage-1)/5),period:type===0?2:type===1?3:1,cd:0,type,boss,reward:Math.ceil(5*Math.pow(1.2,stage-1))*(boss?3:1)};q('.enemy').textContent=boss?'👑':type===0?'🤖':type===1?'🗿':'🥷';q('.enemy').style.opacity='1'}
function problem(){let a,b,op;const type=Math.floor(Math.random()*4);if(type===0){a=1+Math.floor(Math.random()*20);b=1+Math.floor(Math.random()*20);op='＋';answer=a+b}else if(type===1){a=1+Math.floor(Math.random()*20);b=Math.floor(Math.random()*(a+1));op='−';answer=a-b}else if(type===2){a=1+Math.floor(Math.random()*9);b=1+Math.floor(Math.random()*9);op='×';answer=a*b}else{b=1+Math.floor(Math.random()*9);answer=1+Math.floor(Math.random()*9);a=b*answer;op='÷'}q('.expression').textContent=`${a} ${op} ${b} ＝`;renderChoices()}

function renderChoices(){
 const options=new Set([answer]);
 while(options.size<4){const offset=Math.floor(Math.random()*19)-9;const value=answer+offset;if(value>=0)options.add(value)}
 const values=[...options];
 for(let i=values.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[values[i],values[j]]=[values[j],values[i]]}
 choices.replaceChildren();
 for(const value of values){const b=document.createElement('button');b.type='button';b.className='answer cursor-interaction';b.textContent=String(value);b.onclick=()=>choose(value,b);choices.appendChild(b)}
}
function lockChoices(){for(const b of choices.children)b.disabled=true}

function float(text,x,y){const el=document.createElement('span');el.className='float';el.textContent=text;el.style.left=x+'px';el.style.top=y+'px';arena.appendChild(el);effects.push({el,t:.8})}
function earn(n,x,y){const reward=n*mult();coins+=reward;if(n)float('🪙 +'+Number(reward.toFixed(1)),x,y)}
function update(){q('.wallet').textContent='🪙 '+Number(coins.toFixed(1));q('.stage').textContent=`ステージ ${stage}　${enemy.boss?'ボス': ['たんたい','はんい','すばやい'][enemy.type]}`;q('.bar').style.width=Math.max(0,enemy.hp/enemy.max*100)+'%';q('.enemyStats').textContent=`HP ${Math.max(0,Math.ceil(enemy.hp))}/${enemy.max} ｜ こうげき ${enemy.atk}・${enemy.period}びょう ｜ ${enemy.type===1?'まわりに こうげき':'1たいに こうげき'}`;q('.state').textContent=remaining>0?`バトル！ あと ${remaining.toFixed(1)}びょう　／ なかま ${units.length}たい`:`ストップ　／ なかま ${units.length}たい`;q('.progressText').textContent=`せいかい ${correct}もん ｜ コイン ×${mult().toFixed(1)}`;const buttons=root.querySelectorAll('.upgrade');buttons.forEach((b,i)=>{const values=[`${count()} → ${count()+1}たい`,`${attack()} → ${attack()+1}`,`${period().toFixed(2)} → ${Math.max(.15,period()*.9).toFixed(2)}びょう`,`${health()} → ${health()+2}`];b.innerHTML=`<span>${names[i]}　Lv.${levels[i]}</span><small>${values[i]}</small><span>🪙 ${costs[i]}</span>`;b.disabled=remaining>0||coins+1e-8<costs[i]||(i===2&&period()<=.15)});q('.prestige').disabled=remaining>0||cleared<10;q('.prestige').textContent=cleared>=10?`てんせい → コイン ×${(mult()+.5).toFixed(1)}`:'てんせい：10クリアで かいほう'}
for(let i=0;i<4;i++){const b=document.createElement('button');b.type='button';b.className='upgrade cursor-interaction';b.onclick=()=>{if(remaining||coins<costs[i])return;coins-=costs[i];levels[i]++;costs[i]=Math.ceil(costs[i]*growth[i]);if(i===3)units.forEach(u=>{u.hp+=2;u.max+=2});message.textContent=names[i]+' が レベルアップ！';update()};q('.upgrades').appendChild(b)}
function choose(value,button){if(remaining>0)return;if(value!==answer){message.textContent='もういちど かんがえてみよう！';button.classList.add('wrong');button.disabled=true;return}correct++;const w=arena.clientWidth;for(let i=0;i<count();i++){const el=document.createElement('div');el.className='soldier';el.innerHTML='🛡️<div class="life"><i></i></div>';arena.appendChild(el);units.push({id:uid++,el,x:w*(.12+Math.random()*.76),y:247+Math.random()*12,hp:health(),max:health(),cd:0,slot:Math.random()})}remaining=3;lockChoices();message.textContent='せいかい！ とつげき！';update()};
q('.prestige').onclick=()=>{if(cleared<10||remaining)return;prestige++;stage=1;cleared=0;coins=0;levels=[0,0,0,0];costs=[8,5,6,5];units.forEach(u=>u.el.remove());units=[];makeEnemy();problem();message.textContent='てんせい！ コインが ふえやすくなった！';update()};
function win(){remaining=0;cleared=Math.max(cleared,stage);const reward=enemy.reward;earn(units.length+reward,arena.clientWidth/2-45,114);units.forEach(u=>u.el.remove());units=[];q('.enemy').style.opacity='.3';message.textContent=`🎉 ステージ ${stage} クリア！ なかまのぶん＋ほうしゅう ${reward}コイン`;stage++;makeEnemy();finish(false)}
function finish(normal=true){remaining=0;problem();if(normal)message.textContent='つぎの せいかいで また うごくよ！';update()}
function step(dt){const ex=arena.clientWidth/2,ey=116;let engaged=[];for(const u of units){const angle=Math.PI*.12+u.slot*Math.PI*.76,tx=ex+Math.cos(angle)*53,ty=ey+Math.sin(angle)*53,dx=tx-u.x,dy=ty-u.y,d=Math.hypot(dx,dy);if(d>2){const move=Math.min(d,dt*175);u.x+=dx/d*move;u.y+=dy/d*move}else{engaged.push(u);u.cd-=dt;if(u.cd<=0){u.cd+=period();enemy.hp-=attack();float('−'+attack(),ex-15+Math.random()*30,ey-24);if(enemy.hp<=0){win();return}}}}if(engaged.length){enemy.cd-=dt;if(enemy.cd<=0){enemy.cd+=enemy.period;const target=engaged.reduce((a,b)=>a.hp<b.hp?a:b);let victims=[target];if(enemy.type===1){victims=engaged.filter(u=>Math.hypot(u.x-target.x,u.y-target.y)<=55);const ring=document.createElement('div');ring.className='ring';Object.assign(ring.style,{left:target.x-55+'px',top:target.y-55+'px',width:'110px',height:'110px'});arena.appendChild(ring);effects.push({el:ring,t:.4})}victims.forEach(u=>{u.hp-=enemy.atk;float('−'+enemy.atk,u.x,u.y-10)})}}for(let i=units.length-1;i>=0;i--){const u=units[i];if(u.hp<=0){earn(1,u.x,u.y);u.el.remove();units.splice(i,1)}}}
function frame(t){const dt=Math.min((t-last)/1000||0,.04);last=t;if(remaining>0){const slice=Math.min(dt,remaining);remaining-=slice;step(slice);if(remaining<=0&&choices.children[0].disabled)finish();update()}for(const u of units){u.el.style.transform=`translate(${u.x-11}px,${u.y-11}px)`;u.el.querySelector('i').style.width=Math.max(0,u.hp/u.max*100)+'%'}for(let i=effects.length-1;i>=0;i--){effects[i].t-=dt;if(effects[i].t<=0){effects[i].el.remove();effects.splice(i,1)}}requestAnimationFrame(frame)}makeEnemy();problem();update();requestAnimationFrame(frame);
})();
</script>
</div>

</body>
</html>
